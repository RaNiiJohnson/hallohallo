name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, types, tests and build
    runs-on: ubuntu-latest

    env:
      # Values only used to make the Next.js build deterministic in CI.
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://ci-placeholder.convex.site
      SITE_URL: https://ci-placeholder.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      # -----------------------------
      # Code quality
      # -----------------------------

      - name: Lint
        run: pnpm lint
        env:
          CI: true

      - name: Type check
        run: pnpm exec tsc --noEmit
        env:
          CI: true

      # -----------------------------
      # Tests
      # -----------------------------

      - name: Run tests
        run: pnpm test:once
        env:
          CI: true

      # -----------------------------
      # Convex
      # -----------------------------

      - name: Verify Convex generated code
        run: |
          tmp_dir="${RUNNER_TEMP}/convex-codegen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$$"
          mkdir -p "$tmp_dir"

          had_env_local=0
          had_gitignore=0
          had_convex_dir=0

          [ -e .env.local ] && had_env_local=1
          [ -e .gitignore ] && had_gitignore=1
          [ -e .convex ] && had_convex_dir=1

          cleanup() {
            if [ "$had_env_local" -eq 0 ] && [ -e .env.local ]; then
              mv .env.local "$tmp_dir/.env.local"
            fi

            if [ "$had_gitignore" -eq 0 ] && [ -e .gitignore ]; then
              mv .gitignore "$tmp_dir/.gitignore"
            fi

            if [ "$had_convex_dir" -eq 0 ] && [ -e .convex ]; then
              mv .convex "$tmp_dir/.convex"
            fi
          }

          trap cleanup EXIT

          cat > .env.local <<'EOF'
          POSTHOG_PROJECT_TOKEN=ci-placeholder
          EOF


          env -u CONVEX_DEPLOYMENT \
            CONVEX_AGENT_MODE=anonymous \
            pnpm exec convex dev \
            --once \
            --typecheck disable \
            --tail-logs disable

          git diff --exit-code -- convex/_generated

      # -----------------------------
      # Production build
      # -----------------------------

      - name: Build
        run: pnpm build
        env:
          CI: true

  # =================================
  # Production deployment
  # =================================

  deploy:
    name: Deploy production

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: quality

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -----------------------------
      # Convex production deployment
      # -----------------------------

      - name: Deploy Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm exec convex deploy

      # -----------------------------
      # Vercel production deployment
      # -----------------------------

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Build Vercel artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest build \
            --prod \
            --token="$VERCEL_TOKEN"

      - name: Deploy Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
