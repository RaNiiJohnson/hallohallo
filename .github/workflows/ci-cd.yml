name: CI/CD Production & Preview (GitHub + Vercel)

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, types, tests and build
    runs-on: ubuntu-latest

    env:
      # Values only used to make the Next.js build deterministic in CI.
      # This job never talks to a real Convex deployment or Vercel project,
      # it only checks that the code compiles/lints/passes tests/builds.
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://ci-placeholder.convex.site
      SITE_URL: https://ci-placeholder.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      # -----------------------------
      # Code quality checks
      # -----------------------------
      - name: Run linter
        run: pnpm lint
        env:
          CI: true

      - name: Run type checking
        run: pnpm exec tsc --noEmit
        env:
          CI: true

      # -----------------------------
      # Automated tests
      # -----------------------------
      - name: Run unit tests
        run: pnpm test:once
        env:
          CI: true

      # -----------------------------
      # Convex code validation
      # -----------------------------
      - name: Verify Convex generated code
        run: |
          pnpm exec convex init
          pnpm exec convex env set POSTHOG_PROJECT_TOKEN 'ci-placeholder'
          env -u CONVEX_DEPLOYMENT \
            CONVEX_AGENT_MODE=anonymous \
            pnpm exec convex dev \
            --once \
            --typecheck disable \
            --tail-logs disable

          git diff --exit-code -- convex/_generated

      # -----------------------------
      # Verification compile check
      # -----------------------------
      - name: Run dry build
        run: pnpm build
        env:
          CI: true

  # =========================================================
  # PREVIEW DEPLOYMENT (Pull Requests)
  # =========================================================
  preview:
    name: Deploy preview
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: preview

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link and pull Vercel preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          rm -rf .vercel
          pnpm dlx vercel@latest link \
            --yes \
            --scope="$VERCEL_ORG_ID" \
            --project="$VERCEL_PROJECT_ID" \
            --token="$VERCEL_TOKEN"

          pnpm dlx vercel@latest pull \
            --yes \
            --environment=preview \
            --token="$VERCEL_TOKEN"

      # Deploy isolated backend preview deployment first.
      # This generates updated local environment variables.
      - name: Deploy Convex Preview backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: pnpm exec convex deploy --preview

      # Compile frontend artifact using pre-generated preview variables.
      # CONVEX_DISABLE_AUTODEPLOY=1 prevents Vercel from triggering another deploy nested loop.
      - name: Build Vercel artifact (Preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: CONVEX_DISABLE_AUTODEPLOY=1 pnpm dlx vercel@latest build --token=$VERCEL_TOKEN

      - name: Deploy prebuilt artifact to Vercel (Preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest deploy \
            --prebuilt \
            --token="$VERCEL_TOKEN"

  # =========================================================
  # PRODUCTION DEPLOYMENT (Push/Merge to main)
  # =========================================================
  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link and pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          rm -rf .vercel
          pnpm dlx vercel@latest link \
            --yes \
            --scope="$VERCEL_ORG_ID" \
            --project="$VERCEL_PROJECT_ID" \
            --token="$VERCEL_TOKEN"

          pnpm dlx vercel@latest pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      # Deploy schemas and functions to the production backend.
      # This updates the production ecosystem first.
      - name: Deploy Convex Production backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm exec convex deploy

      # Compile production frontend using production variables.
      # CONVEX_DISABLE_AUTODEPLOY=1 prevents Vercel from triggering another deploy nested loop.
      - name: Build Vercel artifact (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: CONVEX_DISABLE_AUTODEPLOY=1 pnpm dlx vercel@latest build --prod --token=$VERCEL_TOKEN

      - name: Deploy prebuilt artifact to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
