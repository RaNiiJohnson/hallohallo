name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, types, tests and build
    runs-on: ubuntu-latest

    env:
      # Values only used to make the Next.js build deterministic in CI.
      # This job never talks to a real Convex deployment or Vercel project,
      # it only checks that the code compiles/lints/passes tests/builds.
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://ci-placeholder.convex.site
      SITE_URL: https://ci-placeholder.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      # -----------------------------
      # Code quality
      # -----------------------------

      - name: Lint
        run: pnpm lint
        env:
          CI: true

      - name: Type check
        run: pnpm exec tsc --noEmit
        env:
          CI: true

      # -----------------------------
      # Tests
      # -----------------------------

      - name: Run tests
        run: pnpm test:once
        env:
          CI: true

      # -----------------------------
      # Convex
      # -----------------------------

      - name: Verify Convex generated code
        run: |
          pnpm exec convex init
          pnpm exec convex env set POSTHOG_PROJECT_TOKEN 'ci-placeholder'
          env -u CONVEX_DEPLOYMENT \
            CONVEX_AGENT_MODE=anonymous \
            pnpm exec convex dev \
            --once \
            --typecheck disable \
            --tail-logs disable

          git diff --exit-code -- convex/_generated

      # -----------------------------
      # Production build (placeholder env vars, just a compile check)
      # -----------------------------

      - name: Build
        run: pnpm build
        env:
          CI: true

  # =================================
  # Preview deployment (Pull Requests)
  # =================================
  #
  # This job gives every PR a *real* preview: it creates/updates a Convex
  # Preview Deployment for the branch and bakes its URL into the Vercel
  # preview build, using `convex deploy --cmd`, exactly like the manual
  # `npx convex deploy --cmd 'npm run build'` flow that already works for you.
  #
  # NOTE: if Vercel's own Git integration is also connected to this repo,
  # it will create its *own* automatic preview deployment for every PR,
  # separate from this job, using whatever env vars are set in the Vercel
  # dashboard for the "Preview" environment — that is almost certainly why
  # your PR previews currently show no Convex data. Either disable Vercel's
  # automatic Git deployments (Project Settings > Git) and rely on this job,
  # or make sure the Preview environment variables in Vercel match a real
  # Convex preview deployment.
  preview:
    name: Deploy preview

    if: github.event_name == 'pull_request'

    needs: quality

    runs-on: ubuntu-latest

    environment:
      name: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link and pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          rm -rf .vercel
          pnpm dlx vercel@latest link \
            --yes \
            --scope="$VERCEL_ORG_ID" \
            --project="$VERCEL_PROJECT_ID" \
            --token="$VERCEL_TOKEN"

          pnpm dlx vercel@latest pull \
            --yes \
            --environment=preview \
            --token="$VERCEL_TOKEN"

      # -----------------------------
      # Convex preview deployment + Vercel build, in one command
      # -----------------------------
      # `convex deploy` (with a Preview Deploy Key) creates/reuses a Convex
      # preview deployment named after the PR's Git branch, then runs the
      # --cmd command with the resulting URL exported as
      # NEXT_PUBLIC_CONVEX_URL, so the Vercel build always points at the
      # Convex deployment that was JUST created — no manual env var to keep
      # in sync.
      - name: Deploy Convex preview and build Vercel artifact
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm exec convex deploy \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL \
            --cmd "pnpm dlx vercel@latest build --token=$VERCEL_TOKEN"

      - name: Deploy Vercel preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest deploy \
            --prebuilt \
            --token="$VERCEL_TOKEN"

  # =================================
  # Production deployment
  # =================================

  deploy:
    name: Deploy production

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: quality

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link and pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          rm -rf .vercel
          pnpm dlx vercel@latest link \
            --yes \
            --scope="$VERCEL_ORG_ID" \
            --project="$VERCEL_PROJECT_ID" \
            --token="$VERCEL_TOKEN"

          pnpm dlx vercel@latest pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      # -----------------------------
      # Convex production deployment + Vercel build, in one command
      # -----------------------------

      - name: Deploy Convex and build Vercel artifact
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm exec convex deploy \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL \
            --cmd "pnpm dlx vercel@latest build --prod --token=$VERCEL_TOKEN"

      - name: Deploy Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ENV: production
        run: |
          pnpm dlx vercel@latest deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
